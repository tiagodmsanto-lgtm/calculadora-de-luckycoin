<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora Econômica Completa</title>

<style>
body{
    background:#1a1a2e;
    font-family:Segoe UI, sans-serif;
    color:#eaeaea;
    display:flex;
    justify-content:center;
    padding:30px;
}

.container{
    background:#16213e;
    padding:25px;
    border-radius:12px;
    width:100%;
    max-width:700px;
}

h2{
    text-align:center;
    color:#e94560;
}

.tabs{
    display:flex;
    margin:20px 0;
}

.tab{
    flex:1;
    padding:10px;
    cursor:pointer;
    text-align:center;
    background:#0f3460;
    border:1px solid #1a1a2e;
}

.tab.active{
    background:#e94560;
    font-weight:bold;
}

.input-group{
    margin-bottom:12px;
}

label{
    font-size:0.9rem;
    color:#bbb;
}

input{
    width:100%;
    padding:8px;
    border-radius:6px;
    border:2px solid #0f3460;
    background:#0f182b;
    color:#fff;
}

button{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#e94560;
    color:white;
    font-size:1.05rem;
    cursor:pointer;
}

.result{
    margin-top:20px;
    background:#0f3460;
    padding:15px;
    border-radius:8px;
}

.result p{
    margin:6px 0;
}

.highlight{
    color:#4caf50;
    font-weight:bold;
}

.warning{
    color:#ff9800;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h2>Calculadora Econômica RavenQuest</h2>

<!-- INPUTS -->
<div class="input-group">
<label>Preço do pacote (R$)</label>
<input id="pkgPrice" type="number" step="0.01">
</div>

<div class="input-group">
<label>Quantidade de Lucky Coins no pacote</label>
<input id="qtyLc" type="number">
</div>

<div class="input-group">
<label>Preço de 1.000.000 Silver (R$)</label>
<input id="silverBrl" type="number" step="0.01">
</div>

<div class="input-group">
<label>Preço da Lucky Coin em Silver</label>
<input id="lcSilver" type="number">
</div>

<div class="input-group">
<label>Preço de 1.000.000 Silver em Token$</label>
<input id="silverToken" type="number">
</div>

<div class="input-group">
<label>Preço do Token$ em Silver</label>
<input id="tokenSilver" type="number">
</div>

<!-- TABS -->
<div class="tabs">
<div class="tab active" onclick="setTab('lc')">Lucky Coin</div>
<div class="tab" onclick="setTab('silver')">Silver</div>
<div class="tab" onclick="setTab('token')">Token$</div>
</div>

<button onclick="calcular()">Calcular</button>

<div class="result" id="result" style="display:none"></div>
</div>

<script>
let currentTab = "lc";

function setTab(tab){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    event.target.classList.add('active');
}

function calcular(){
    const pkg = +pkgPrice.value;
    const qty = +qtyLc.value;
    const silverBrlVal = +silverBrl.value;
    const lcSilverVal = +lcSilver.value;
    const silverTokenVal = +silverToken.value;
    const tokenSilverVal = +tokenSilver.value;

    if(!pkg||!qty||!silverBrlVal||!lcSilverVal||!silverTokenVal||!tokenSilverVal){
        alert("Preencha todos os campos.");
        return;
    }

    const lcBrl = pkg / qty;
    const silverUnitBrl = silverBrlVal / 1_000_000;
    const tokenBrl = (tokenSilverVal * silverUnitBrl);

    let html = "";

    if(currentTab==="lc"){
        html += `<p>💰 Lucky Coin em R$: <b>${lcBrl.toFixed(4)}</b></p>`;
        html += `<p>🪙 Lucky Coin em Silver: <b>${lcSilverVal.toLocaleString()}</b></p>`;
        html += `<p>💠 Lucky Coin em Token$: <b>${(lcSilverVal/tokenSilverVal).toFixed(2)}</b></p>`;
    }

    if(currentTab==="silver"){
        html += `<p>🪙 1M Silver em R$: <b>${silverBrlVal.toFixed(2)}</b></p>`;
        html += `<p>💰 1M Silver em Lucky Coins: <b>${(1_000_000/lcSilverVal).toFixed(2)}</b></p>`;
        html += `<p>💠 1M Silver em Token$: <b>${silverTokenVal.toFixed(2)}</b></p>`;
    }

    if(currentTab==="token"){
        html += `<p>💠 Token$ em R$: <b>${tokenBrl.toFixed(4)}</b></p>`;
        html += `<p>🪙 Token$ em Silver: <b>${tokenSilverVal.toLocaleString()}</b></p>`;
        html += `<p>💰 Token$ em Lucky Coins: <b>${(tokenSilverVal/lcSilverVal).toFixed(2)}</b></p>`;
    }

    const cheapest = Math.min(lcBrl, silverUnitBrl*lcSilverVal, tokenBrl*(lcSilverVal/tokenSilverVal));

    html += `<hr>`;
    html += `<p class="highlight">✅ Forma mais barata de compra detectada automaticamente</p>`;
    html += `<p>📉 Valor mínimo Lucky Coin (Silver): <b>${lcBrl/silverUnitBrl}</b></p>`;
    html += `<p>📉 Valor mínimo Silver (R$ por 1M): <b>${silverBrlVal.toFixed(2)}</b></p>`;

    result.innerHTML = html;
    result.style.display="block";
}
</script>

</body>
</html>
