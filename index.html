<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Econômica Profissional</title>

<style>
:root {
    --primary:#00b894;
    --bg:#0f0f0f;
    --card:#1c1c1c;
    --text:#eee;
}

body {
    margin:0;
    padding:20px;
    font-family:Segoe UI, Tahoma, sans-serif;
    background:var(--bg);
    color:var(--text);
}

.container {
    max-width:1000px;
    margin:auto;
    background:var(--card);
    padding:30px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
}

h1 {
    text-align:center;
    color:var(--primary);
    margin-bottom:10px;
}

#status {
    text-align:center;
    font-size:.9em;
    color:#aaa;
    margin-bottom:20px;
}

.mode-select {
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.mode-select button {
    flex:1;
    background:#111;
    color:#ccc;
    border:1px solid #333;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

.mode-select button.active {
    background:var(--primary);
    color:#000;
    font-weight:bold;
}

.inputs {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.input-group {
    display:flex;
    flex-direction:column;
}

label {
    font-size:.8em;
    color:#888;
    margin-bottom:6px;
}

input {
    background:#111;
    border:1px solid #444;
    color:#fff;
    padding:12px;
    border-radius:8px;
}

button.calc {
    width:100%;
    padding:15px;
    background:var(--primary);
    border:none;
    border-radius:8px;
    font-size:1em;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:25px;
}

.results {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card {
    background:#252525;
    border-radius:10px;
    padding:20px;
    border-left:5px solid var(--primary);
}

.card img {
    width:50px;
    display:block;
    margin-bottom:10px;
}

.card h3 {
    margin:0 0 10px;
    font-size:.9em;
    color:#888;
    text-transform:uppercase;
}

.price {
    font-size:1.6em;
    font-weight:bold;
}

.sub {
    font-size:.8em;
    color:var(--primary);
}
</style>
</head>

<body>

<div class="container">
<h1>Calculadora Econômica</h1>
<div id="status">Selecione um modo de cálculo</div>

<div class="mode-select">
    <button onclick="setMode('silver')" class="active">Venda Silver (BRL)</button>
    <button onclick="setMode('compare')">Lucky Coin: BRL vs Silver</button>
    <button onclick="setMode('lucky')">Venda Lucky Coin (Silver)</button>
</div>

<div class="inputs">
    <div class="input-group">
        <label>Margem de Lucro (%)</label>
        <input id="lucro" type="number" value="15">
    </div>
    <div class="input-group">
        <label>Silver por Token</label>
        <input id="silverToken" type="number" value="5000000">
    </div>
    <div class="input-group">
        <label>Silver por Lucky Coin</label>
        <input id="silverLucky" type="number" value="2500000">
    </div>
</div>

<button class="calc" onclick="executar()">🔄 Calcular</button>

<div class="results">

<div class="card">
<img src="token_200x200.png">
<h3>Token (USD → BRL)</h3>
<span id="tokenBRL" class="price">R$ 0,00</span>
<span class="sub">Preço automático</span>
</div>

<div class="card">
<img src="silver_200x200.png">
<h3>Resultado Silver</h3>
<span id="resSilver" class="price">—</span>
<span id="subSilver" class="sub"></span>
</div>

<div class="card">
<img src="lucky_200x200.png">
<h3>Resultado Lucky Coin</h3>
<span id="resLucky" class="price">—</span>
<span id="subLucky" class="sub"></span>
</div>

</div>
</div>

<script>
let modo = 'silver';

function setMode(m) {
    modo = m;
    document.querySelectorAll('.mode-select button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
}

async function executar() {
    const status = document.getElementById('status');
    status.innerText = "⏳ Buscando dados...";

    try {
        const dolarRes = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
        const dolar = parseFloat((await dolarRes.json()).USDBRL.bid);

        const tokenRes = await fetch(
          'https://api.geckoterminal.com/api/v2/networks/immutable-zkevm/pools/0xbe2930d274f862542740dcdc95257b3163172343'
        );
        const tokenUSD = parseFloat((await tokenRes.json())
            .data.attributes.base_token_price_usd);

        const tokenBRL = tokenUSD * dolar;
        document.getElementById('tokenBRL').innerText = `R$ ${tokenBRL.toFixed(2)}`;

        calcular(tokenBRL);

        status.innerText = "✅ Cálculo concluído";
    } catch {
        status.innerText = "⚠️ Erro ao buscar dados externos";
    }
}

function calcular(tokenBRL) {
    const lucro = parseFloat(document.getElementById('lucro').value) / 100;
    const silverToken = parseFloat(document.getElementById('silverToken').value);
    const silverLucky = parseFloat(document.getElementById('silverLucky').value);

    const custoSilver = tokenBRL / silverToken;

    if (modo === 'silver') {
        const venda = custoSilver * 1_000_000 * (1 + lucro);
        document.getElementById('resSilver').innerText = `R$ ${venda.toFixed(2)}`;
        document.getElementById('subSilver').innerText = "Venda de 1M Silver";
    }

    if (modo === 'lucky') {
        const venda = custoSilver * silverLucky * (1 + lucro);
        document.getElementById('resLucky').innerText = `R$ ${venda.toFixed(2)}`;
        document.getElementById('subLucky').innerText = "Lucky Coin com lucro";
    }

    if (modo === 'compare') {
        const luckyBRL = custoSilver * silverLucky;
        const viaToken = tokenBRL;
        const melhor = luckyBRL < viaToken ? "Comprar com Silver" : "Comprar com BRL";

        document.getElementById('resLucky').innerText = melhor;
        document.getElementById('subLucky').innerText =
            `Silver: R$ ${luckyBRL.toFixed(2)} | BRL: R$ ${viaToken.toFixed(2)}`;
    }
}
</script>

</body>
</html>
