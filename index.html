<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora Econômica</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
}
h1 { text-align: center; }
.container {
    max-width: 1000px;
    margin: auto;
    background: #1c1c1c;
    padding: 20px;
    border-radius: 8px;
}
label { display: block; margin-top: 10px; }
input {
    width: 100%;
    padding: 8px;
    border-radius: 4px;
    border: none;
    margin-top: 4px;
}
.tabs {
    display: flex;
    gap: 5px;
    margin-top: 20px;
}
.tab {
    flex: 1;
    background: #333;
    padding: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.tab img { width: 28px; }
.tab.active { background: #00b894; color: #000; }
.content { display: none; margin-top: 20px; }
.content.active { display: block; }

.result, .panel {
    background: #2a2a2a;
    padding: 15px;
    border-radius: 6px;
    margin-top: 15px;
}

.result-header {
    display: flex;
    align-items: center;
    gap: 15px;
}
.result-header img { width: 64px; }

.highlight { color: #00ff9d; font-weight: bold; }
.bad { color: #ff7675; font-weight: bold; }
.warn { color: #fdcb6e; font-weight: bold; }
.na { opacity: 0.6; }
</style>
</head>

<body>

<h1>Calculadora Econômica</h1>

<div class="container">

<h2>🔹 Dados de Entrada</h2>

<label>Quantidade de Lucky Coins no pacote</label>
<input id="luckyQtd" type="number">

<label>Preço do pacote (R$)</label>
<input id="precoPacote" type="number" step="0.01">

<label>Preço de 1.000.000 Silver (R$)</label>
<input id="silverReal" type="number" step="0.01">

<label>Preço da Lucky Coin em Silver</label>
<input id="luckySilver" type="number">

<label>Preço de 1.000.000 Silver (Token$)</label>
<input id="silverToken" type="number">

<label>Preço do Token$ em Silver</label>
<input id="tokenSilver" type="number">

<div class="tabs">
    <div class="tab active" onclick="openTab(0)">
        <img src="lucky_200x200.png"> Lucky Coin
    </div>
    <div class="tab" onclick="openTab(1)">
        <img src="silver_200x200.png"> Silver
    </div>
    <div class="tab" onclick="openTab(2)">
        <img src="token_200x200.png"> Token$
    </div>
</div>

<!-- PAINEL GLOBAL -->
<div id="globalPanel" class="panel"></div>

<div id="tab0" class="content active"></div>
<div id="tab1" class="content"></div>
<div id="tab2" class="content"></div>

</div>

<script>
const els = {
    luckyQtd: luckyQtd,
    precoPacote: precoPacote,
    silverReal: silverReal,
    luckySilver: luckySilver,
    silverToken: silverToken,
    tokenSilver: tokenSilver
};

function v(n) { return isFinite(n) && n > 0 ? n : null; }
function f(n, d=2) { return n === null ? '<span class="na">—</span>' : n.toFixed(d); }

function openTab(i) {
    document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));
    document.querySelectorAll('.content').forEach((c,idx)=>c.classList.toggle('active',idx===i));
    calcular();
}

function calcular() {
    const luckyQtd = v(+els.luckyQtd.value);
    const precoPacote = v(+els.precoPacote.value);
    const silverReal = v(+els.silverReal.value);
    const luckySilver = v(+els.luckySilver.value);
    const silverToken = v(+els.silverToken.value);
    const tokenSilver = v(+els.tokenSilver.value);

    const precoLuckyReal = luckyQtd && precoPacote ? precoPacote / luckyQtd : null;
    const realPorSilver = silverReal ? silverReal / 1_000_000 : null;
    const silverPorReal = silverReal ? 1_000_000 / silverReal : null;
    const tokenReal = tokenSilver && realPorSilver ? tokenSilver * realPorSilver : null;

    /* ================= RANKING ================= */
    const ranking = [];

    if (precoLuckyReal) ranking.push({nome:'Lucky Coin', valor:precoLuckyReal});
    if (silverReal) ranking.push({nome:'Silver', valor:silverReal});
    if (tokenReal) ranking.push({nome:'Token$', valor:tokenReal});

    ranking.sort((a,b)=>a.valor-b.valor);

    /* ================= MARGENS ================= */
    const margemLuckySilver = precoLuckyReal && silverPorReal
        ? precoLuckyReal * silverPorReal
        : null;

    const alertaLucky = luckySilver && margemLuckySilver && luckySilver < margemLuckySilver;

    /* ================= PAINEL GLOBAL ================= */
    document.getElementById('globalPanel').innerHTML = `
        <h3>🏆 Mais barato comprar com</h3>
        ${ranking.length
            ? `<span class="highlight">${ranking[0].nome}</span>`
            : '<span class="na">Dados insuficientes</span>'}

        <h3 style="margin-top:15px;">📉 Margem mínima (Lucky Coin)</h3>
        ${margemLuckySilver
            ? `${Math.ceil(margemLuckySilver).toLocaleString()} Silver`
            : '<span class="na">—</span>'}

        <h3 style="margin-top:15px;">⚠️ Alertas</h3>
        ${alertaLucky
            ? '<span class="bad">Lucky Coin está sendo vendida abaixo do custo!</span>'
            : '<span class="highlight">Nenhum alerta crítico</span>'}
    `;

    /* ================= ABAS ================= */
    document.getElementById('tab0').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="lucky_200x200.png">
                <h3>Lucky Coin</h3>
            </div>
            R$: ${f(precoLuckyReal)}<br>
            Silver: ${f(luckySilver,0)}<br>
            Token$: ${tokenSilver && luckySilver ? f(luckySilver/tokenSilver) : '<span class="na">—</span>'}
        </div>
    `;

    document.getElementById('tab1').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="silver_200x200.png">
                <h3>1.000.000 Silver</h3>
            </div>
            R$: ${f(silverReal)}<br>
            Lucky Coin: ${luckySilver ? f(1_000_000/luckySilver) : '<span class="na">—</span>'}<br>
            Token$: ${f(silverToken)}
        </div>
    `;

    document.getElementById('tab2').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="token_200x200.png">
                <h3>Token$</h3>
            </div>
            R$: ${f(tokenReal)}<br>
            Silver: ${f(tokenSilver,0)}<br>
            Lucky Coin: ${tokenSilver && luckySilver ? f(tokenSilver/luckySilver) : '<span class="na">—</span>'}
        </div>
    `;
}

document.querySelectorAll('input').forEach(i => i.addEventListener('input', calcular));
calcular();
</script>

</body>
</html>
