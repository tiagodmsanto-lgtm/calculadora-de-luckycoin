<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lucky Coin – Calculadora Profissional</title>

<style>
body{
    background:#0b1020;
    color:#e5e7eb;
    font-family:Arial, Helvetica, sans-serif;
    padding:20px;
}
h1,h2{margin-top:0}
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}
.tabs button{
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:#1e293b;
    color:#fff;
    cursor:pointer;
}
.tabs button.active{
    background:#2563eb;
}
.section{
    display:none;
    background:#020617;
    padding:20px;
    border-radius:14px;
}
.section.active{display:block}
label{
    font-size:0.9em;
    color:#94a3b8;
}
input{
    width:100%;
    padding:10px;
    margin:6px 0 14px;
    border-radius:8px;
    border:none;
}
button.calc{
    width:100%;
    padding:12px;
    background:#22c55e;
    border:none;
    border-radius:10px;
    font-size:1em;
    font-weight:bold;
    cursor:pointer;
}
.result{
    margin-top:15px;
    background:#020617;
    padding:14px;
    border-radius:10px;
    line-height:1.5;
}
</style>
</head>

<body>

<h1>💰 Lucky Coin Calculator</h1>

<div class="tabs">
    <button class="active" onclick="openTab(0)">Comparar Lucky</button>
    <button onclick="openTab(1)">Venda Lucky</button>
    <button onclick="openTab(2)">Cotação Token</button>
</div>

<!-- ================= ABA 1 ================= -->
<div class="section active">
<h2>🟢 Comparar compra da Lucky Coin</h2>

<label>Preço da Lucky Coin em Silver (in-game)</label>
<input id="luckySilverGame" type="number">

<label>Preço do pacote Lucky Coin (BRL)</label>
<input id="pacoteBRL1" type="number">

<label>Quantidade de Lucky Coin no pacote</label>
<input id="qtdLucky1" type="number">

<label>Margem de lucro desejada (%)</label>
<input id="lucro1" type="number">

<button class="calc" onclick="compararLucky()">Calcular</button>
<div class="result" id="resComparar"></div>
</div>

<!-- ================= ABA 2 ================= -->
<div class="section">
<h2>🟢 Venda da Lucky Coin por Silver</h2>

<label>Preço do pacote Lucky Coin (BRL)</label>
<input id="pacoteBRL2" type="number">

<label>Quantidade de Lucky Coin no pacote</label>
<input id="qtdLucky2" type="number">

<label>Lucro desejado (%)</label>
<input id="lucro2" type="number">

<button class="calc" onclick="vendaLucky()">Calcular</button>
<div class="result" id="resVenda"></div>
</div>

<!-- ================= ABA 3 ================= -->
<div class="section">
<h2>🟢 Cotação Token / Silver (Automática)</h2>
<div class="result" id="resCotacao">Carregando cotação...</div>
</div>

<script>
let valorSilverBRL = 0;

// ================= TABS =================
function openTab(i){
    document.querySelectorAll('.section').forEach((s,idx)=>{
        s.classList.toggle('active', idx===i);
    });
    document.querySelectorAll('.tabs button').forEach((b,idx)=>{
        b.classList.toggle('active', idx===i);
    });
}

// ================= COTAÇÃO AUTOMÁTICA =================
async function carregarCotacao(){
    const POOL_ID = "0xbe2930d274f862542740dcdc95257b3163172343";
    const USD_BRL = 5.10; // ajuste se quiser

    const res = await fetch(
        `https://api.geckoterminal.com/api/v2/networks/immutable-zkevm/pools/${POOL_ID}`
    );
    const data = await res.json();

    const tokenUSD = parseFloat(
        data.data.attributes.base_token_price_usd
    );

    const tokenBRL = tokenUSD * USD_BRL;

    // VALOR DO TOKEN EM SILVER (fixo do jogo)
    const TOKEN_EM_SILVER = 1_000_000;

    valorSilverBRL = tokenBRL / TOKEN_EM_SILVER;

    document.getElementById("resCotacao").innerHTML = `
    Token RavenQuest: <b>R$ ${tokenBRL.toFixed(6)}</b><br>
    1.000.000 Silver: <b>R$ ${(valorSilverBRL * 1_000_000).toFixed(2)}</b><br>
    <small>Fonte: GeckoTerminal (atualização automática)</small>
    `;
}

// ================= ABA 1 =================
function compararLucky(){
    const luckyGame = +luckySilverGame.value;
    const pacote = +pacoteBRL1.value;
    const qtd = +qtdLucky1.value;
    const lucro = +lucro1.value / 100;

    const custoLuckyBRL = pacote / qtd;
    const custoLuckySilver = custoLuckyBRL / valorSilverBRL;
    const precoVenda = custoLuckySilver * (1 + lucro);

    const melhor =
        custoLuckySilver < luckyGame
        ? "Comprar com BRL é mais barato"
        : "Comprar com Silver é mais barato";

    resComparar.innerHTML = `
    Lucky via Silver: <b>${luckyGame.toLocaleString()} Silver</b><br>
    Lucky via BRL: <b>${custoLuckySilver.toLocaleString()} Silver</b><br><br>
    <strong>${melhor}</strong><br><br>
    Preço ideal de venda:<br>
    <b>${precoVenda.toLocaleString()} Silver</b>
    `;
}

// ================= ABA 2 =================
function vendaLucky(){
    const pacote = +pacoteBRL2.value;
    const qtd = +qtdLucky2.value;
    const lucro = +lucro2.value / 100;

    const custoLuckyBRL = pacote / qtd;
    const custoLuckySilver = custoLuckyBRL / valorSilverBRL;
    const precoVenda = custoLuckySilver * (1 + lucro);

    resVenda.innerHTML = `
    Custo da Lucky: <b>${custoLuckySilver.toLocaleString()} Silver</b><br>
    Preço ideal de venda:<br>
    <strong>${precoVenda.toLocaleString()} Silver</strong>
    `;
}

// AUTOLOAD
carregarCotacao();
</script>

</body>
</html>
