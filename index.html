<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Venda Profissional - Silver & Lucky</title>
    <style>
        :root {
            --primary: #00b894;
            --bg: #0f0f0f;
            --card-bg: #1c1c1c;
            --text: #eee;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 900px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }

        .grid-inputs { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 25px; 
        }

        .input-group { display: flex; flex-direction: column; }

        label { font-size: 0.85em; color: #888; margin-bottom: 8px; }

        input { 
            background: #111; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 1em; 
        }

        input:focus { border-color: var(--primary); outline: none; }

        .btn-sync { 
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 15px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 1em; 
            cursor: pointer; 
            width: 100%; 
            margin-bottom: 20px; 
            transition: 0.3s;
        }

        .btn-sync:hover { background: #009476; transform: translateY(-2px); }

        .results-area { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            background: #252525; 
            padding: 20px; 
            border-radius: 10px; 
            border-left: 5px solid var(--primary); 
        }

        .card h3 { margin: 0 0 10px 0; font-size: 0.9em; color: #888; text-transform: uppercase; }

        .price { font-size: 1.8em; font-weight: bold; color: #fff; display: block; }

        .sub { font-size: 0.8em; color: var(--primary); margin-top: 5px; display: block; }

        #status { text-align: center; font-size: 0.9em; margin-bottom: 15px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora Econômica</h1>

    <div id="status">Clique no botão para atualizar cotações</div>

    <div class="grid-inputs">
        <div class="input-group">
            <label>Margem de Lucro (%)</label>
            <input id="lucroPct" type="number" value="15">
        </div>
        <div class="input-group">
            <label>Token Valor (USD)</label>
            <input id="tokenUSD" type="number" step="0.01" value="20.00">
        </div>
        <div class="input-group">
            <label>Token no Jogo (Silver)</label>
            <input id="tokenSilver" type="number" value="5000000">
        </div>
        <div class="input-group">
            <label>Lucky Coin (Silver)</label>
            <input id="luckySilver" type="number" value="50000">
        </div>
    </div>

    <button class="btn-sync" onclick="main()">🔄 Atualizar e Calcular Venda</button>

    <div class="results-area">
        <div class="card">
            <h3>Dólar Hoje</h3>
            <span id="resDolar" class="price">R$ 0,00</span>
            <span class="sub">Cotação Comercial</span>
        </div>
        <div class="card">
            <h3>Custo Token BRL</h3>
            <span id="resTokenBRL" class="price" style="color: #ff9f43;">R$ 0,00</span>
            <span class="sub">Valor convertido</span>
        </div>
        <div class="card">
            <h3>Venda 1M Silver</h3>
            <span id="resVendaSilver" class="price" style="color: #00ff9d;">R$ 0,00</span>
            <span id="lucroSilver" class="sub">Lucro: R$ 0,00</span>
        </div>
        <div class="card">
            <h3>Venda Lucky Coin</h3>
            <span id="resVendaLucky" class="price" style="color: #00ff9d;">R$ 0,00</span>
            <span id="lucroLucky" class="sub">Lucro: R$ 0,00</span>
        </div>
    </div>
</div>

<script>
    async function main() {
        const status = document.getElementById('status');
        status.innerText = "⏳ Sincronizando dados...";

        try {
            // 1. Pega Cotação do Dólar Real
            const responseDolar = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
            const dataDolar = await responseDolar.json();
            const dolarValor = parseFloat(dataDolar.USDBRL.bid);
            document.getElementById('resDolar').innerText = `R$ ${dolarValor.toFixed(2)}`;

            // 2. BUSCA PREÇO DO TOKEN (Sua URL de referência)
            // Substitua aqui: const minhaUrl = "https://www.geckoterminal.com/immutable-zkevm/pools/0xbe2930d274f862542740dcdc95257b3163172343?utm_source=coingecko&utm_medium=referral&utm_campaign=searchresults";
            // Nota: Se o site não permitir fetch, o valor usado será o que estiver no input "Token Valor (USD)"
            
            /* EXEMPLO DE LOGICA PARA O SEU SITE:
            const resSite = await fetch('SUA_URL_AQUI');
            const html = await resSite.text();
            // Aqui você precisaria de uma lógica para extrair o preço do HTML
            */

            calcular(dolarValor);

            status.innerText = "✅ Valores atualizados com sucesso!";
            status.style.color = "#00b894";
        } catch (error) {
            status.innerText = "⚠️ Erro ao buscar dólar. Usando valores manuais.";
            status.style.color = "#ff7675";
            calcular(5.00); // Valor padrão caso falhe
        }
    }

    function calcular(dolar) {
        // Captura valores dos inputs
        const lucroPct = parseFloat(document.getElementById('lucroPct').value) / 100;
        const tokenUSD = parseFloat(document.getElementById('tokenUSD').value);
        const tokenSilver = parseFloat(document.getElementById('tokenSilver').value);
        const luckySilver = parseFloat(document.getElementById('luckySilver').value);

        // Cálculos de Custo
        const tokenBRL = tokenUSD * dolar;
        const custoPorUmSilver = tokenBRL / tokenSilver;
        const custoUmMilhao = custoPorUmSilver * 1000000;
        const custoLucky = custoPorUmSilver * luckySilver;

        // Cálculos de Venda (Custo + Lucro)
        const vendaSilver = custoUmMilhao * (1 + lucroPct);
        const vendaLucky = custoLucky * (1 + lucroPct);

        // Exibição
        document.getElementById('resTokenBRL').innerText = `R$ ${tokenBRL.toFixed(2)}`;
        
        document.getElementById('resVendaSilver').innerText = `R$ ${vendaSilver.toFixed(2)}`;
        document.getElementById('lucroSilver').innerText = `Lucro líquido: R$ ${(vendaSilver - custoUmMilhao).toFixed(2)}`;

        document.getElementById('resVendaLucky').innerText = `R$ ${vendaLucky.toFixed(2)}`;
        document.getElementById('lucroLucky').innerText = `Lucro líquido: R$ ${(vendaLucky - custoLucky).toFixed(2)}`;
    }
</script>

</body>
</html>
