<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lucky Coin – Calculadora Profissional</title>

<style>
body{
    background:#0b1020;
    color:#e5e7eb;
    font-family:Arial, Helvetica, sans-serif;
    padding:20px;
}
h1,h2{margin-top:0}
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}
.tabs button{
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:#1e293b;
    color:#fff;
    cursor:pointer;
}
.tabs button.active{
    background:#2563eb;
}
.section{
    display:none;
    background:#020617;
    padding:20px;
    border-radius:14px;
}
.section.active{display:block}
label{
    font-size:0.9em;
    color:#94a3b8;
}
input{
    width:100%;
    padding:10px;
    margin:6px 0 14px;
    border-radius:8px;
    border:none;
}
button.calc{
    width:100%;
    padding:12px;
    background:#22c55e;
    border:none;
    border-radius:10px;
    font-size:1em;
    font-weight:bold;
    cursor:pointer;
}
.result{
    margin-top:15px;
    background:#020617;
    padding:14px;
    border-radius:10px;
    line-height:1.6;
}
small{color:#64748b}
</style>
</head>

<body>

<h1>💰 Lucky Coin Calculator</h1>

<div class="tabs">
    <button class="active" onclick="openTab(0)">Cotação</button>
    <button onclick="openTab(1)">Comparar Lucky</button>
    <button onclick="openTab(2)">Venda Lucky</button>
    <button onclick="openTab(3)">Venda Silver</button>
</div>

<!-- ABA 0 — COTAÇÃO -->
<div class="section active">
<h2>Cotação Token / Silver (Automática)</h2>

<label>USD → BRL (configurável)</label>
<input id="usdBrl" type="number" value="5.10" step="0.01">

<label>1 Token equivale a quantos Silver (jogo)</label>
<input id="tokenSilver" type="number" value="1000000">

<div class="result" id="resCotacao">Carregando cotação...</div>
</div>

<!-- ABA 1 -->
<div class="section">
<h2>Comparar compra da Lucky Coin</h2>

<label>Preço da Lucky Coin em Silver (in-game)</label>
<input id="luckySilverGame" type="number">

<label>Preço do pacote Lucky Coin (BRL)</label>
<input id="pacoteBRL1" type="number">

<label>Quantidade de Lucky Coin no pacote</label>
<input id="qtdLucky1" type="number">

<label>Margem de lucro (%)</label>
<input id="lucro1" type="number">

<button class="calc" onclick="compararLucky()">Calcular</button>
<div class="result" id="resComparar"></div>
</div>

<!-- ABA 2 -->
<div class="section">
<h2>Venda da Lucky Coin por Silver</h2>

<label>Preço do pacote Lucky Coin (BRL)</label>
<input id="pacoteBRL2" type="number">

<label>Quantidade de Lucky Coin no pacote</label>
<input id="qtdLucky2" type="number">

<label>Margem de lucro (%)</label>
<input id="lucro2" type="number">

<button class="calc" onclick="vendaLucky()">Calcular</button>
<div class="result" id="resVenda"></div>
</div>

<!-- ABA 3 -->
<div class="section">
<h2>Venda de Silver</h2>
<p><small>Conversão automática usando a cotação atual</small></p>

<button class="calc" onclick="vendaSilver()">Calcular</button>
<div class="result" id="resSilver"></div>
</div>

<script>
const POOL_ID = "0xbe2930d274f862542740dcdc95257b3163172343";
let valorSilverBRL = 0;

// Tabs
function openTab(i){
    document.querySelectorAll('.section').forEach((s,idx)=>{
        s.classList.toggle('active', idx===i);
    });
    document.querySelectorAll('.tabs button').forEach((b,idx)=>{
        b.classList.toggle('active', idx===i);
    });
}

// Cotação automática (GeckoTerminal)
async function carregarCotacao(){
    try{
        const res = await fetch(
            `https://api.geckoterminal.com/api/v2/networks/immutable-zkevm/pools/${POOL_ID}`
        );
        const json = await res.json();

        const tokenUSD = Number(
            json.data.attributes.base_token_price_usd
        );

        if(!tokenUSD || isNaN(tokenUSD)) throw "Preço inválido";

        const usdBrl = Number(usdBrlInput.value);
        const tokenBRL = tokenUSD * usdBrl;
        const tokenSilver = Number(tokenSilverInput.value);

        valorSilverBRL = tokenBRL / tokenSilver;

        resCotacao.innerHTML = `
        Token (USD): <b>$ ${tokenUSD.toFixed(6)}</b><br>
        Token (BRL): <b>R$ ${tokenBRL.toFixed(6)}</b><br><br>
        1 Silver = <b>R$ ${valorSilverBRL.toFixed(8)}</b><br>
        1.000.000 Silver = <b>R$ ${(valorSilverBRL*1_000_000).toFixed(2)}</b>
        `;
    }catch{
        resCotacao.innerHTML = "❌ Erro ao validar preço do token.";
    }
}

// ABA 1
function compararLucky(){
    const luckyGame = Number(luckySilverGame.value);
    const pacote = Number(pacoteBRL1.value);
    const qtd = Number(qtdLucky1.value);
    const lucro = Number(lucro1.value)/100;

    const custoLuckyBRL = pacote / qtd;
    const custoLuckySilver = custoLuckyBRL / valorSilverBRL;
    const precoVenda = custoLuckySilver * (1+lucro);

    const melhor =
        custoLuckySilver < luckyGame ? "BRL" : "Silver";

    resComparar.innerHTML = `
    Lucky via Silver: <b>${luckyGame.toFixed(0)} Silver</b><br>
    Lucky via BRL: <b>${custoLuckySilver.toFixed(0)} Silver</b><br>
    Mais barata: <b>${melhor}</b><br><br>
    Venda ideal: <b>${precoVenda.toFixed(0)} Silver</b>
    `;
}

// ABA 2
function vendaLucky(){
    const pacote = Number(pacoteBRL2.value);
    const qtd = Number(qtdLucky2.value);
    const lucro = Number(lucro2.value)/100;

    const custoLuckySilver = (pacote/qtd)/valorSilverBRL;
    const precoVenda = custoLuckySilver*(1+lucro);

    resVenda.innerHTML = `
    Custo: <b>${custoLuckySilver.toFixed(0)} Silver</b><br>
    Venda ideal: <b>${precoVenda.toFixed(0)} Silver</b>
    `;
}

// ABA 3
function vendaSilver(){
    resSilver.innerHTML = `
    1.000.000 Silver = 
    <b>R$ ${(valorSilverBRL*1_000_000).toFixed(2)}</b>
    `;
}

// aliases
const usdBrlInput = document.getElementById("usdBrl");
const tokenSilverInput = document.getElementById("tokenSilver");

// init
usdBrlInput.onchange = carregarCotacao;
tokenSilverInput.onchange = carregarCotacao;
carregarCotacao();
</script>

</body>
</html>
