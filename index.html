<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora Econômica - Lucky / Silver / Token</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: #1c1c1c;
    padding: 20px;
    border-radius: 8px;
}

label {
    display: block;
    margin-top: 10px;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border-radius: 4px;
    border: none;
}

.tabs {
    display: flex;
    margin-top: 20px;
    gap: 5px;
}

.tab {
    flex: 1;
    padding: 10px;
    cursor: pointer;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.tab img {
    width: 32px;
    height: 32px;
}

.tab.active {
    background: #00b894;
    color: #000;
}

.content {
    display: none;
    margin-top: 20px;
}

.content.active {
    display: block;
}

.result {
    background: #2a2a2a;
    padding: 15px;
    border-radius: 6px;
}

.result-header {
    display: flex;
    align-items: center;
    gap: 15px;
}

.result-header img {
    width: 64px;
    height: 64px;
}

.highlight {
    color: #00ff9d;
    font-weight: bold;
    margin-top: 10px;
    display: block;
}
</style>
</head>

<body>

<h1>Calculadora Econômica</h1>

<div class="container">

<h2>🔹 Dados de Entrada</h2>

<label>Quantidade de Lucky Coins no pacote</label>
<input id="luckyQtd" type="number">

<label>Preço do pacote (R$)</label>
<input id="precoPacote" type="number" step="0.01">

<label>Preço de 1.000.000 de Silver em Reais</label>
<input id="silverReal" type="number" step="0.01">

<label>Preço da Lucky Coin em Silver (mercado)</label>
<input id="luckySilver" type="number">

<label>Preço de 1.000.000 de Silver em Token$</label>
<input id="silverToken" type="number">

<label>Preço do Token$ em Silver</label>
<input id="tokenSilver" type="number">

<!-- ABAS -->
<div class="tabs">
    <div class="tab active" onclick="openTab(0)">
        <img src="lucky_200x200.png"> Lucky Coin
    </div>
    <div class="tab" onclick="openTab(1)">
        <img src="silver_200x200.png"> Silver
    </div>
    <div class="tab" onclick="openTab(2)">
        <img src="token_200x200.png"> Token$
    </div>
</div>

<div class="content active" id="tab0"></div>
<div class="content" id="tab1"></div>
<div class="content" id="tab2"></div>

</div>

<script>
function openTab(index) {
    document.querySelectorAll('.tab').forEach((t,i)=>{
        t.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.content').forEach((c,i)=>{
        c.classList.toggle('active', i === index);
    });
    calcular();
}

function calcular() {
    const luckyQtd = +document.getElementById('luckyQtd').value;
    const precoPacote = +document.getElementById('precoPacote').value;
    const silverReal = +document.getElementById('silverReal').value;
    const luckySilver = +document.getElementById('luckySilver').value;
    const silverToken = +document.getElementById('silverToken').value;
    const tokenSilver = +document.getElementById('tokenSilver').value;

    if (!luckyQtd || !precoPacote || !silverReal || !luckySilver || !tokenSilver) return;

    const precoLuckyReal = precoPacote / luckyQtd;
    const realPorSilver = silverReal / 1_000_000;
    const silverPorReal = 1_000_000 / silverReal;
    const tokenReal = tokenSilver * realPorSilver;

    // Lucky Coin
    document.getElementById('tab0').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="lucky_200x200.png">
                <h3>Preço Médio da Lucky Coin</h3>
            </div>
            R$: ${precoLuckyReal.toFixed(2)}<br>
            Silver: ${luckySilver.toLocaleString()}<br>
            Token$: ${(luckySilver / tokenSilver).toFixed(2)}
            <span class="highlight">
                Valor mínimo de venda (Silver): ${Math.ceil(precoLuckyReal * silverPorReal).toLocaleString()}
            </span>
        </div>
    `;

    // Silver
    document.getElementById('tab1').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="silver_200x200.png">
                <h3>Preço Médio de 1.000.000 Silver</h3>
            </div>
            R$: ${silverReal.toFixed(2)}<br>
            Lucky Coin: ${(1_000_000 / luckySilver).toFixed(2)}<br>
            Token$: ${silverToken}
            <span class="highlight">
                Valor mínimo de venda em R$: ${silverReal.toFixed(2)}
            </span>
        </div>
    `;

    // Token
    document.getElementById('tab2').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="token_200x200.png">
                <h3>Preço Médio do Token$</h3>
            </div>
            R$: ${tokenReal.toFixed(2)}<br>
            Silver: ${tokenSilver.toLocaleString()}<br>
            Lucky Coin: ${(tokenSilver / luckySilver).toFixed(2)}
        </div>
    `;
}

document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', calcular);
});
</script>

</body>
</html>
