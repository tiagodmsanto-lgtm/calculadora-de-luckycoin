<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora Econômica</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
}
h1 { text-align: center; }
.container {
    max-width: 1100px;
    margin: auto;
    background: #1c1c1c;
    padding: 20px;
    border-radius: 8px;
}
label { display: block; margin-top: 10px; }
input {
    width: 100%;
    padding: 8px;
    border-radius: 4px;
    border: none;
    margin-top: 4px;
}
.tabs {
    display: flex;
    gap: 5px;
    margin-top: 20px;
}
.tab {
    flex: 1;
    background: #333;
    padding: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.tab img { width: 28px; }
.tab.active { background: #00b894; color: #000; }
.content { display: none; margin-top: 20px; }
.content.active { display: block; }

.panel, .result {
    background: #2a2a2a;
    padding: 15px;
    border-radius: 6px;
    margin-top: 15px;
}

.result-header {
    display: flex;
    align-items: center;
    gap: 15px;
}
.result-header img { width: 64px; }

.highlight { color: #00ff9d; font-weight: bold; }
.bad { color: #ff7675; font-weight: bold; }
.na { opacity: 0.6; }
</style>
</head>

<body>

<h1>Calculadora Econômica</h1>

<div class="container">

<h2>🔹 Dados de Entrada</h2>

<label>Quantidade de Lucky Coins no pacote</label>
<input id="luckyQtd" type="number">

<label>Preço do pacote (R$)</label>
<input id="precoPacote" type="number" step="0.01">

<label>Preço de 1.000.000 Silver (R$)</label>
<input id="silverReal" type="number" step="0.01">

<label>Preço da Lucky Coin em Silver</label>
<input id="luckySilver" type="number">

<label>Preço de 1.000.000 Silver (Token$)</label>
<input id="silverToken" type="number">

<label>Preço do Token$ em Silver</label>
<input id="tokenSilver" type="number">

<label>📈 Lucro desejado (%)</label>
<input id="lucroPct" type="number" step="0.1">

<div class="tabs">
    <div class="tab active" onclick="openTab(0)">
        <img src="lucky_200x200.png"> Lucky Coin
    </div>
    <div class="tab" onclick="openTab(1)">
        <img src="silver_200x200.png"> Silver
    </div>
    <div class="tab" onclick="openTab(2)">
        <img src="token_200x200.png"> Token$
    </div>
</div>

<div id="globalPanel" class="panel"></div>

<div id="tab0" class="content active"></div>
<div id="tab1" class="content"></div>
<div id="tab2" class="content"></div>

</div>

<script>
function v(n){ return isFinite(n) && n>0 ? n : null }
function f(n,d=2){ return n===null ? '<span class="na">—</span>' : n.toFixed(d) }

function openTab(i){
    document.querySelectorAll('.tab').forEach((t,x)=>t.classList.toggle('active',x===i))
    document.querySelectorAll('.content').forEach((c,x)=>c.classList.toggle('active',x===i))
    calcular()
}

function calcular(){
    const luckyQtd = v(+luckyQtdEl.value)
    const precoPacote = v(+precoPacoteEl.value)
    const silverReal = v(+silverRealEl.value)
    const luckySilver = v(+luckySilverEl.value)
    const silverToken = v(+silverTokenEl.value)
    const tokenSilver = v(+tokenSilverEl.value)
    const lucroPct = v(+lucroPctEl.value)

    const precoLuckyReal = luckyQtd && precoPacote ? precoPacote/luckyQtd : null
    const realPorSilver = silverReal ? silverReal/1_000_000 : null
    const silverPorReal = silverReal ? 1_000_000/silverReal : null

    const vendaSilverReal = silverReal && lucroPct
        ? silverReal * (1 + lucroPct/100)
        : null

    const vendaLuckySilver = luckySilver && lucroPct
        ? luckySilver * (1 + lucroPct/100)
        : null

    document.getElementById('globalPanel').innerHTML = `
        <h3>📈 Preço mínimo de venda com lucro</h3>

        <b>Silver (1.000.000):</b><br>
        ${vendaSilverReal ? `<span class="highlight">R$ ${vendaSilverReal.toFixed(2)}</span>` : '<span class="na">—</span>'}

        <br><br>

        <b>Lucky Coin:</b><br>
        ${vendaLuckySilver ? `<span class="highlight">${Math.ceil(vendaLuckySilver).toLocaleString()} Silver</span>` : '<span class="na">—</span>'}
    `

    document.getElementById('tab0').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="lucky_200x200.png">
                <h3>Lucky Coin</h3>
            </div>
            Custo atual: ${f(luckySilver,0)} Silver<br>
            Venda com lucro: ${vendaLuckySilver ? `<span class="highlight">${Math.ceil(vendaLuckySilver).toLocaleString()}</span>` : '<span class="na">—</span>'}
        </div>
    `

    document.getElementById('tab1').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="silver_200x200.png">
                <h3>1.000.000 Silver</h3>
            </div>
            Custo atual: R$ ${f(silverReal)}<br>
            Venda com lucro: ${vendaSilverReal ? `<span class="highlight">R$ ${vendaSilverReal.toFixed(2)}</span>` : '<span class="na">—</span>'}
        </div>
    `

    document.getElementById('tab2').innerHTML = `
        <div class="result">
            <div class="result-header">
                <img src="token_200x200.png">
                <h3>Token$</h3>
            </div>
            Utilize como intermediário de conversão
        </div>
    `
}

const luckyQtdEl = luckyQtd
const precoPacoteEl = precoPacote
const silverRealEl = silverReal
const luckySilverEl = luckySilver
const silverTokenEl = silverToken
const tokenSilverEl = tokenSilver
const lucroPctEl = lucroPct

document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calcular))
calcular()
</script>

</body>
</html>
