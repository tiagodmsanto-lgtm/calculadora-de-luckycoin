<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Arbitragem – Lucky Coin</title>

<style>
:root{
    --primary:#00b894;
    --bg:#0f0f0f;
    --card:#1c1c1c;
    --text:#eee;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI, Tahoma, sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
    background:var(--card);
    padding:30px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
}

h1{
    text-align:center;
    color:var(--primary);
}

#status{
    text-align:center;
    font-size:.9em;
    color:#aaa;
    margin-bottom:20px;
}

.inputs{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:.8em;
    color:#888;
    margin-bottom:6px;
}

input{
    background:#111;
    border:1px solid #444;
    color:#fff;
    padding:12px;
    border-radius:8px;
}

button{
    width:100%;
    padding:15px;
    background:var(--primary);
    border:none;
    border-radius:8px;
    font-size:1em;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:30px;
}

.results{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#252525;
    padding:20px;
    border-radius:10px;
    border-left:5px solid var(--primary);
}

.card img{
    width:48px;
    margin-bottom:10px;
}

.card h3{
    font-size:.85em;
    color:#888;
    margin:0 0 10px;
    text-transform:uppercase;
}

.price{
    font-size:1.6em;
    font-weight:bold;
}

.sub{
    font-size:.8em;
    color:var(--primary);
}
</style>
</head>

<body>

<div class="container">
<h1>Calculadora de Arbitragem – Lucky Coin</h1>
<div id="status">Pronto para calcular</div>

<div class="inputs">
    <div class="input-group">
        <label>Margem de lucro (%)</label>
        <input id="lucro" type="number" value="15">
    </div>

    <div class="input-group">
        <label>Silver por Token</label>
        <input id="silverToken" type="number" value="5000000">
    </div>

    <div class="input-group">
        <label>Silver por Lucky Coin (compra in-game)</label>
        <input id="silverLucky" type="number" value="2500000">
    </div>

    <div class="input-group">
        <label>Preço pacote Lucky (BRL)</label>
        <input id="pacoteBRL" type="number" value="220">
    </div>

    <div class="input-group">
        <label>Quantidade de Lucky no pacote</label>
        <input id="qtdLucky" type="number" value="110">
    </div>
</div>

<button onclick="executar()">🔄 Calcular Arbitragem</button>

<div class="results">

<div class="card">
<img src="token_200x200.png">
<h3>Token (USD → BRL)</h3>
<span id="tokenBRL" class="price">R$ 0,00</span>
<span class="sub">Cotação automática</span>
</div>

<div class="card">
<img src="lucky_200x200.png">
<h3>Compra mais barata</h3>
<span id="melhorCompra" class="price">—</span>
<span id="detCompra" class="sub"></span>
</div>

<div class="card">
<img src="silver_200x200.png">
<h3>Venda ideal Lucky (em Silver)</h3>
<span id="vendaLucky" class="price">—</span>
<span class="sub">Lucky comprada com BRL</span>
</div>

</div>
</div>

<script>
async function executar(){
    const status = document.getElementById('status');
    status.innerText = "⏳ Buscando dados...";

    try{
        const dolarRes = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
        const dolar = parseFloat((await dolarRes.json()).USDBRL.bid);

        const tokenRes = await fetch(
            'https://api.geckoterminal.com/api/v2/networks/immutable-zkevm/pools/0xbe2930d274f862542740dcdc95257b3163172343'
        );
        const tokenUSD = parseFloat(
            (await tokenRes.json()).data.attributes.base_token_price_usd
        );

        const tokenBRL = tokenUSD * dolar;
        document.getElementById('tokenBRL').innerText =
            `R$ ${tokenBRL.toFixed(2)}`;

        calcular(tokenBRL);
        status.innerText = "✅ Arbitragem calculada";

    }catch{
        status.innerText = "⚠️ Erro ao buscar dados externos";
    }
}

function calcular(tokenBRL){
    const lucro = parseFloat(lucroInput.value)/100;
    const silverToken = parseFloat(silverTokenInput.value);
    const silverLucky = parseFloat(silverLuckyInput.value);
    const pacoteBRL = parseFloat(pacoteBRLInput.value);
    const qtdLucky = parseFloat(qtdLuckyInput.value);

    const valorSilverBRL = tokenBRL / silverToken;

    const custoLuckyBRL = pacoteBRL / qtdLucky;
    const custoLuckySilverViaBRL = custoLuckyBRL / valorSilverBRL;

    const melhor =
        custoLuckySilverViaBRL < silverLucky
        ? "Comprar com BRL"
        : "Comprar com Silver";

    melhorCompra.innerText = melhor;
    detCompra.innerText =
        `BRL ≈ ${custoLuckySilverViaBRL.toFixed(0)} Silver | In-game = ${silverLucky.toFixed(0)} Silver`;

    const vendaIdealSilver =
        custoLuckySilverViaBRL * (1 + lucro);

    vendaLucky.innerText =
        `${vendaIdealSilver.toFixed(0)} Silver`;
}

const lucroInput = document.getElementById('lucro');
const silverTokenInput = document.getElementById('silverToken');
const silverLuckyInput = document.getElementById('silverLucky');
const pacoteBRLInput = document.getElementById('pacoteBRL');
const qtdLuckyInput = document.getElementById('qtdLucky');
</script>

</body>
</html>
