<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lucky Coin Calculator</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    margin: 0;
    padding: 20px;
}
h2 { margin-top: 0 }
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
button {
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    background: #1e293b;
    color: #fff;
    border-radius: 6px;
}
button.active {
    background: #2563eb;
}
.section {
    display: none;
    background: #020617;
    padding: 20px;
    border-radius: 10px;
}
.section.active {
    display: block;
}
input {
    width: 100%;
    padding: 8px;
    margin: 6px 0 12px;
    border-radius: 6px;
    border: none;
}
.result {
    background: #020617;
    padding: 10px;
    border-radius: 6px;
    margin-top: 10px;
}
small {
    opacity: 0.7;
}
</style>
</head>
<body>

<h1>💰 Lucky Coin Tool</h1>

<div class="tabs">
    <button class="active" onclick="openTab(0)">Comparar Compra</button>
    <button onclick="openTab(1)">Venda Lucky Coin</button>
    <button onclick="openTab(2)">Cotação Token / Silver</button>
</div>

<!-- ABA 1 -->
<div class="section active">
    <h2>🟢 Comparar compra da Lucky Coin</h2>

    <label>Preço da Lucky Coin em Silver (in-game)</label>
    <input type="number" id="silverLucky">

    <label>Preço do pacote em BRL</label>
    <input type="number" id="pacoteBRL">

    <label>Quantidade de Lucky Coins no pacote</label>
    <input type="number" id="qtdLucky">

    <button onclick="compararCompra()">Calcular</button>

    <div class="result" id="resultadoComparacao"></div>
</div>

<!-- ABA 2 -->
<div class="section">
    <h2>🟢 Venda da Lucky Coin por Silver</h2>

    <label>Preço do pacote em BRL</label>
    <input type="number" id="pacoteBRLVenda">

    <label>Quantidade de Lucky Coins no pacote</label>
    <input type="number" id="qtdLuckyVenda">

    <label>Margem de lucro (%)</label>
    <input type="number" id="lucro">

    <button onclick="calcularVenda()">Calcular</button>

    <div class="result" id="resultadoVenda"></div>
</div>

<!-- ABA 3 -->
<div class="section">
    <h2>🟢 Cotação Token / Silver</h2>

    <label>Quantidade de Silver correspondente a 1 Token</label>
    <input type="number" id="silverPorToken">

    <button onclick="buscarCotacao()">Buscar Cotação</button>

    <div class="result" id="resultadoCotacao"></div>
</div>

<script>
let valorSilverBRL = 0;

function openTab(index) {
    document.querySelectorAll('.section').forEach((s, i) => {
        s.classList.toggle('active', i === index);
    });
    document.querySelectorAll('button').forEach((b, i) => {
        if (i < 3) b.classList.toggle('active', i === index);
    });
}

// ABA 1
function compararCompra() {
    if (valorSilverBRL === 0) {
        alert("Atualize a cotação na Aba 3 primeiro.");
        return;
    }

    const silverLucky = Number(silverLucky.value);
    const pacote = Number(pacoteBRL.value);
    const qtd = Number(qtdLucky.value);

    const custoLuckyBRL = pacote / qtd;
    const custoLuckySilverViaBRL = custoLuckyBRL / valorSilverBRL;

    let melhor =
        custoLuckySilverViaBRL < silverLucky
        ? "Comprar Lucky com BRL é mais barato"
        : "Comprar Lucky com Silver é mais barato";

    resultadoComparacao.innerHTML = `
    Lucky via Silver: <b>${silverLucky.toLocaleString()} Silver</b><br>
    Lucky via BRL: <b>${custoLuckySilverViaBRL.toLocaleString()} Silver</b><br><br>
    <strong>${melhor}</strong>
    `;
}

// ABA 2
function calcularVenda() {
    if (valorSilverBRL === 0) {
        alert("Atualize a cotação na Aba 3 primeiro.");
        return;
    }

    const pacote = Number(pacoteBRLVenda.value);
    const qtd = Number(qtdLuckyVenda.value);
    const lucro = Number(lucro.value) / 100;

    const custoLuckyBRL = pacote / qtd;
    const custoLuckySilver = custoLuckyBRL / valorSilverBRL;
    const precoVenda = custoLuckySilver * (1 + lucro);

    resultadoVenda.innerHTML = `
    Custo por Lucky: <b>${custoLuckySilver.toLocaleString()} Silver</b><br>
    Preço ideal de venda: <b>${precoVenda.toLocaleString()} Silver</b>
    `;
}

// ABA 3
async function buscarCotacao() {
    const silverToken = Number(silverPorToken.value);

    const tokenRes = await fetch("https://api.geckoterminal.com/api/v2/simple/networks/eth/token_price/0x0000000000000000000000000000000000000000");
    const tokenData = await tokenRes.json();
    const tokenUSD = Object.values(tokenData.data.attributes.token_prices)[0];

    const usdRes = await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL");
    const usdData = await usdRes.json();
    const usdBRL = Number(usdData.USDBRL.bid);

    const tokenBRL = tokenUSD * usdBRL;
    valorSilverBRL = tokenBRL / silverToken;

    resultadoCotacao.innerHTML = `
    Token: <b>R$ ${tokenBRL.toFixed(4)}</b><br>
    1.000.000 Silver: <b>R$ ${(valorSilverBRL * 1_000_000).toFixed(2)}</b>
    `;
}
</script>

</body>
</html>
